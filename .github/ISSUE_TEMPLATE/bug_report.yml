name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands and config files used.
      render: bash
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, package versions, torch device, hardware (if any)
      placeholder: "Ubuntu 24.04, Python 3.12, torch 2.5 (CPU)"
    validations:
      required: true
